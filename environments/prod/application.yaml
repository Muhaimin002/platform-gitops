apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-native-app-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: portfolio
  source:
    repoURL: git@github.com:Muhaimin002/platform-gitops.git
    targetRevision: main
    path: apps/cloud-native-app
    helm:
      releaseName: cloud-native-app
      valueFiles:
        - ../../environments/prod/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  # Manual sync only. Production changes need an approved pull request first.
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
