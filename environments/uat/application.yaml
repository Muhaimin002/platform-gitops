apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-native-app-uat
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: portfolio
  source:
    repoURL: git@github.com:Muhaimin002/platform-gitops.git
    targetRevision: main
    path: apps/cloud-native-app
    helm:
      releaseName: cloud-native-app
      valueFiles:
        - ../../environments/uat/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: uat
  # No "automated" block: a person must press Sync. Drift is shown, not reverted.
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
