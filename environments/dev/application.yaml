apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-native-app-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: portfolio
  source:
    repoURL: git@github.com:Muhaimin002/platform-gitops.git
    targetRevision: main
    path: apps/cloud-native-app
    helm:
      releaseName: cloud-native-app
      valueFiles:
        - ../../environments/dev/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
