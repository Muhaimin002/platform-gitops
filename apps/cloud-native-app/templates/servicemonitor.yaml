{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "cna.name" . }}
  labels:
    {{- include "cna.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "cna.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
{{- end }}
